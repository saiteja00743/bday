<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diary</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#7a1f1f;--deep:#5a1114;--cream:#f4ede1;--paper:#fbf6ec;--blush:#e8b4ae;--rose:#c4373f;--ink:#2a1212}
*{box-sizing:border-box;margin:0}
.script{font-family:'Caveat',cursive;font-weight:700;color:var(--wine)}
.ph{background:var(--img) center/cover no-repeat,linear-gradient(135deg,#e8b4ae,#c98b8b);position:relative;width:100%;height:100%}
.ph::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:#fff8;font-size:2rem;z-index:-1}
.big{font:400 clamp(3rem,13vw,7rem)/1 'Gloock',serif;color:var(--wine)}
.polaroid{background:#fff;padding:7px 7px 26px;box-shadow:0 3px 10px #0004;transform:rotate(3deg);width:80%;aspect-ratio:4/5;margin:auto;position:relative;display:flex;flex-direction:column}
.polaroid .ph{flex:1;height:auto}
.polaroid em{position:absolute;bottom:3px;left:0;right:0;text-align:center;font:500 1rem 'Caveat',cursive;color:var(--wine)}
.tape{position:absolute;top:-10px;left:50%;width:60px;height:20px;background:#e8b4ae99;transform:translateX(-50%) rotate(-4deg)}
/* diary: page-turn book */
.dwrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.book3d{container-type:inline-size;position:relative;width:min(700px,100%);aspect-ratio:3/2;perspective:2000px;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.book3d.closed{transform:translateX(-25%)}.book3d.end{transform:translateX(25%)}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,0,.2,1);cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3%;padding:8% 9%;overflow:hidden}
.face.front{border-radius:0 8px 8px 0;box-shadow:inset 10px 0 14px -10px #0005}
.face.back{transform:rotateY(180deg);border-radius:8px 0 0 8px;box-shadow:inset -10px 0 14px -10px #0005}
.face.cover{background:var(--deep);color:var(--paper);box-shadow:inset 0 0 0 7px var(--deep),inset 0 0 0 9px var(--blush)}
.face.cover b{font:400 clamp(2rem,12cqw,5.5rem)/1 'Gloock',serif}
.face.cover .script{color:var(--blush);font-size:clamp(1.2rem,5cqw,2.4rem)}
.face.cover small{font:500 clamp(.9rem,3.4cqw,1.5rem) 'Caveat',cursive;color:var(--blush)}
.face p{font:500 clamp(13px,3.4cqw,24px)/1.2 'Caveat',cursive;color:var(--ink)}
.face .big{font-size:clamp(2.4rem,11cqw,6.5rem)}
.mini{width:78%;flex:1;min-height:0;padding:5px;background:#fff;box-shadow:0 2px 8px #0003;transform:rotate(-2deg);display:flex}
.mini .ph{flex:1;height:auto}
.face .polaroid{width:76%;aspect-ratio:auto;flex:1;min-height:0;margin:0}
.spine{position:absolute;left:50%;top:8%;bottom:8%;width:20px;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:space-between;z-index:300;pointer-events:none;transition:opacity .4s}
.spine i{height:10px;border-radius:5px;background:#222}
.book3d.closed .spine,.book3d.end .spine{opacity:0}
.dctl{display:flex;gap:12px;align-items:center;color:var(--blush);font:500 1.2rem 'Caveat',cursive}
.dctl button{font:700 1.4rem 'Caveat',cursive;color:var(--wine);background:var(--paper);border:0;border-radius:99px;padding:0 18px;cursor:pointer}
.dctl button:disabled{opacity:.4;cursor:default}
body{margin:0;min-height:100vh;background:var(--wine);display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:Georgia,serif;overflow-x:hidden}
@media(max-width:640px){.book3d{aspect-ratio:5/4}}
</style>
</head>
<body>
<div class="dwrap" id="diary"></div>
<script>
/* ============ EDIT ONLY THIS BLOCK ============ */
const CONFIG = {
  name: "Kayla Varshini",
  dob: "2005-11-28",
  from: "",
  photos: ["photos/1.jpg","photos/2.jpg","photos/3.jpg","photos/4.jpg"],
  diary: "Happy birthday! Another year of you making the world a little brighter. I hope today feels as special as you are.",
  diaryCaption: "my favourite person",
  messages: [
    "Thank you for every laugh, every random call, every little memory.",
    "May this year bring you everything you’ve been quietly wishing for.",
    "You deserve cake, flowers and the best day ever."
  ]
};
/* ================================================ */
const $ = s => document.querySelector(s);
const C = CONFIG, first = C.name.split(" ")[0];
const dob = new Date(C.dob), now = new Date();
const age = now.getFullYear() - dob.getFullYear();
const dateTxt = dob.toLocaleDateString("en-GB",{day:"numeric",month:"long"});
const ph = (i,extra="") => `<div class="ph ${extra}" style="--img:url('${C.photos[i % C.photos.length]}')"></div>`;
const showGate = () => {}; // in the full site this unlocks the next step

const ord = n => { const t=["th","st","nd","rd"], v=n%100; return n+(t[(v-20)%10]||t[v]||t[0]); };
const m = i => C.messages[i] || "";
const pg = [
 `<span class="script">my</span><b>Diary</b><small>${first}’s ${ord(age)} birthday</small>`,
 `<div class="big">${age}</div><p>${C.diary}</p>${C.from?`<p>— ${C.from}</p>`:""}`,
 `<div class="polaroid"><span class="tape"></span>${ph(0)}<em>${C.diaryCaption}</em></div>`,
 `<div class="mini">${ph(1)}</div><p>${m(0)}</p>`,
 `<p>${m(1)}</p><div class="polaroid"><span class="tape"></span>${ph(2)}</div>`,
 `<div class="mini">${ph(3)}</div><p>${m(2)}</p>`,
 `<div class="big">♥</div><p>happy birthday, ${first}!</p><p>${dateTxt}</p>`,
 `<span class="script">with love</span>`];
const leaves = [0,1,2,3].map(i=>`<div class="leaf"><div class="face front${i==0?" cover":""}">${pg[2*i]}</div><div class="face back${i==3?" cover":""}">${pg[2*i+1]}</div></div>`).join("");

$("#diary").innerHTML = `<div class="book3d closed" id="book"><div class="spine">${"<i></i>".repeat(8)}</div>${leaves}</div><div class="dctl"><button id="prev" aria-label="Previous page">‹</button><span id="dhint"></span><button id="next" aria-label="Next page">›</button></div>`;

/* diary page turning */
(function(){
  const book=$("#book"), L=[...book.querySelectorAll(".leaf")], n=L.length; let cur=0;
  L.forEach((l,i)=>l.style.zIndex=n-i);
  const up=()=>{
    L.forEach((l,i)=>{const f=i<cur; if(f!==l.classList.contains("flipped")){l.style.zIndex=50;setTimeout(()=>l.style.zIndex=f?i+1:n-i,450)} l.classList.toggle("flipped",f)});
    book.classList.toggle("closed",cur===0); book.classList.toggle("end",cur===n); if(cur===n) setTimeout(()=>showGate("diary"),900);
    $("#prev").disabled=cur===0; $("#next").disabled=cur===n;
    $("#dhint").textContent=cur===0?"tap the book to open":cur===n?"the end":"tap to turn the page";
  };
  L.forEach((l,i)=>l.onclick=()=>{cur=l.classList.contains("flipped")?i:i+1;up()});
  $("#next").onclick=()=>{if(cur<n){cur++;up()}};
  $("#prev").onclick=()=>{if(cur>0){cur--;up()}};
  up();
})();


</script>
</body>
</html>
